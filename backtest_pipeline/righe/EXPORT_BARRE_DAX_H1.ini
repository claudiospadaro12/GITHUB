; MARCATORE_INI_CLAU12_EXPORT_BARRE_DAX_H1_v1
; Template del .ini per EXPORT_BARRE_DAX_H1.ps1 (copia di EXPORT_BARRE_DOW_H1.ini con Symbol=D30EUR). ASCII puro.
; Le righe che cominciano con ';' le TOGLIE il driver prima di passare il file al terminale.
; Il driver sostituisce SOLO due segnaposto: @@DATA_A@@ (data del lancio, aaaa.mm.gg) e @@RUN@@ (12 esadecimali).
; FromDate 2024.09.26 = prima data H1 di D30EUR misurata dalla sonda del 17/08/2026
;   (backtest_pipeline/risultati_archivio/sonda_storico_17-08/215D85D7_ABTG_InfoBroker.csv: 10553 barre H1, COMPLETO).
; ToDate = data del lancio, come per il Dow. La MISURA usa 2024.09.26 -> 2026.09.30 INCLUSA (la taglia il lettore):
;   il tester si ferma a ToDate 00:00 e l'ULTIMA barra dell'ultimo giorno resta fuori (Dow 11/10: venerdi 09/10 senza la
;   barra delle 21:00 che ogni altro venerdi recente ha), quindi ToDate=2026.10.01 perderebbe l'ultima barra del 30/09.
;   Il driver rifiuta un lancio con data del lancio prima del 2026.10.02.
; Model=1 = 1 minuto OHLC: le barre H1 si costruiscono dalle M1, nessun tick reale serve (si esportano barre, non si misura un merito).
; Visual=0: il tester NON e' un grafico. AllowLiveTrading=false: comunque l'EA non contiene nessuna funzione d'ordine.
[Experts]
AllowLiveTrading=false
AllowDllImport=false

[Tester]
Expert=CLAU12_EXPORT_BARRE_H1.ex5
Symbol=D30EUR
Period=H1
Model=1
Optimization=0
Visual=0
FromDate=2024.09.26
ToDate=@@DATA_A@@
ForwardMode=0
Deposit=100000
Currency=EUR
Leverage=100
ExecutionMode=0
ShutdownTerminal=1

[TesterInputs]
InpRunId=@@RUN@@
