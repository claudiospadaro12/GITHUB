<body><script type="module">
import * as THREE from 'three';
const Q=new URLSearchParams(location.search), V=Q.get('v')||'A', CAM=Q.get('cam')||'3q';

const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
const W=+(Q.get('w')||1600),H=+(Q.get('h')||1200);R.setSize(W,H);R.setPixelRatio(1);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
document.body.appendChild(R.domElement);
const S=new THREE.Scene();

sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-200,right:200,top:260,bottom:-60,near:10,far:900});sun.shadow.bias=-0.0004;S.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:0,...o});

// pavimento
const floor=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:'#e9ebef',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
// ---------- texture
const pegTex=tex(512,1024,(g,w,h)=>{g.fillStyle=SAND;g.fillRect(0,0,w,h);g.fillStyle='#bdb6a6';for(let x=16;x<w;x+=32)for(let y=16;y<h;y+=32){g.beginPath();g.arc(x,y,3,0,7);g.fill()}});
const blisterTex=(top)=>tex(280,680,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle=top;g.fillRect(0,0,w,95);g.fillStyle='#fff';g.beginPath();g.arc(w/2,48,12,0,7);g.fill();
 g.fillStyle='#fff';g.drawImage(logo,40,110,200,104);g.fillStyle='#b9814a';g.fillRect(w/2-17,260,34,190);g.fillStyle='#e6d3a0';g.fillRect(w/2-45,440,90,95);g.fillStyle='#a9803f';g.fillRect(w/2-45,525,90,10);
 g.fillStyle=INK;g.font='bold 24px Arial';g.textAlign='center';g.fillText('PENNELLO',w/2,590);g.fillStyle=top;g.font='20px Arial';g.fillText('Made in Italy',w/2,625)});
const furTex=(base)=>tex(512,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const l=Math.random()*.25;g.fillStyle=`rgba(${l>.12?255:90},${l>.12?255:90},${l>.12?255:90},.10)`;g.fillRect(Math.random()*w,Math.random()*h,1.4,5+Math.random()*6)}});
const headerTex=(w,h,wide)=>tex(1000,Math.round(1000*h/w),(g,cw,ch)=>{g.fillStyle=BLUE;g.fillRect(0,0,cw,ch);
 g.fillStyle='#fff';rr(g,cw*.04,ch*.16,cw*.38,ch*.68,cw*.015);g.fill();const lw=cw*.34,lh=lw*1040/2000;g.drawImage(logo,cw*.06,ch*.5-lh/2,lw,lh);
 g.fillStyle='#fff';g.font=`bold ${ch*.19}px Arial`;g.textAlign='left';g.fillText('PENNELLI',cw*.46,ch*.45);g.fillText('E RULLI',cw*.46,ch*.67);
 g.fillStyle='#FFD9A0';g.font=`${ch*.08}px Arial`;g.fillText('per ogni superficie.',cw*.46,ch*.84);
 if(wide){g.fillStyle='#fff';g.fillRect(cw*.86,ch*.1,ch*.25,ch*.25);g.fillStyle=INK;g.font=`bold ${ch*.07}px Arial`;g.textAlign='center';g.fillText('QR',cw*.86+ch*.125,ch*.26)}});
const promoTex=tex(920,320,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle=BLUE;g.font='bold 62px Arial';g.fillText('SCEGLI IL RULLO',36,92);g.fillStyle=INK;g.font='34px Arial';g.fillText('per la tua superficie',36,142);
 [['#3850A2','LISCE',0],['#2E8B8B','POCO R.',1],['#E8731A','RUVIDE',2],['#B23A2E','MOLTO R.',3]].forEach(([c,n,k],i)=>{const x=36+i*92;g.fillStyle=c;rr(g,x,185,84,66,8);g.fill();g.fillStyle='#fff';for(let d=0;d<3;d++){g.beginPath();g.arc(x+20+d*22,218,d<k?8:3.5,0,7);g.fill()}g.fillStyle=INK;g.font='bold 17px Arial';g.textAlign='center';g.fillText(n,x+42,278);g.textAlign='left'})});
const lipTex=tex(920,70,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle=BLUE;g.fillRect(0,h-9,w,9);g.fillStyle='#e9eaee';g.fillRect(8,8,52,52);g.strokeStyle='#999';g.strokeRect(8,8,52,52);for(let i=0;i<5;i++){g.fillStyle='#FFF3B0';g.fillRect(110+i*168,14,128,38);g.strokeStyle='#aaa';g.strokeRect(110+i*168,14,128,38);g.fillStyle=INK;g.font='bold 24px Arial';g.textAlign='center';g.fillText('€',174+i*168,42)}});
// ---------- costruzione
const CFG={A:{w:50,d:40,h:220,base:12,hdr:25,faces:2,rows:4,trays:[[25,1],[23,1],[20,2],[10,4]],pitch:17,promo:16,floor:0},
           B:{w:45,d:30,h:88,base:4,hdr:12,faces:1,rows:2,trays:[[20,2],[10,3]],pitch:17,promo:0,floor:4}}[V];
const root=new THREE.Group();S.add(root);
if(V==='B'){root.add(box(130,4,70,M('#b98a56',{roughness:.55}),0,2,6));root.position.y=0;}
const oy=CFG.floor;
const g0=new THREE.Group();g0.position.y=oy;root.add(g0);
const {w,d,h,base,hdr}=CFG;
const matBase=M('#3a4556',{roughness:.6});
g0.add(box(w,base,d,matBase,0,base/2,0));
const depthFace=(d-2)/2;
const door=new THREE.Mesh(new THREE.PlaneGeometry(w-6,base-3),M('#4a566a'));door.position.set(0,base/2,d/2+.02);g0.add(door);
const bodyH=h-base-hdr; const bodyY=base+bodyH/2;
g0.add(box(w,bodyH,2,M(SAND),0,bodyY,0));
g0.add(box(2.2,bodyH,d*.98,M('#e4ddcf'),-w/2+1.1,bodyY,0)); g0.add(box(2.2,bodyH,d*.98,M('#e4ddcf'),w/2-1.1,bodyY,0));
const hdrM=new THREE.Mesh(new THREE.BoxGeometry(w,hdr,6),[M(BLUE),M(BLUE),M(BLUE),M(BLUE),new THREE.MeshStandardMaterial({map:headerTex(w,hdr,V==='A'),roughness:.5}),new THREE.MeshStandardMaterial({map:headerTex(w,hdr,V==='A'),roughness:.5})]);
hdrM.position.set(0,h-hdr/2,0);hdrM.castShadow=true;g0.add(hdrM);
function face(){
  const f=new THREE.Group();
  const trayTop=base+CFG.trays.length*CFG.pitch, pegBot=trayTop+CFG.promo, pegTop=h-hdr;
  const pw=w-5, ph=pegTop-pegBot;
  const peg=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),new THREE.MeshStandardMaterial({map:pegTex,roughness:.8}));peg.position.set(0,pegBot+ph/2,1.05);peg.receiveShadow=true;f.add(peg);
  // blister
  const rp=ph/CFG.rows;const cols=5,pitch=8;
  for(let r=0;r<CFG.rows;r++){const top=(r+Math.floor(r/1))%2===0?BLUE:ORANGE;
    for(let c=0;c<cols;c++){const mats=[M('#eee'),M('#eee'),M('#eee'),M('#eee'),new THREE.MeshStandardMaterial({map:blisterTex(top),roughness:.45}),M('#eee')];
      const b=new THREE.Mesh(new THREE.BoxGeometry(7,17,9.6),mats);b.position.set((c-2)*pitch,pegTop-1.5-r*rp-9,1+4.8+.3);b.castShadow=true;b.receiveShadow=true;f.add(b);
      const hook=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,10,8),M('#777',{metalness:.6,roughness:.3}));hook.rotation.x=Math.PI/2;hook.position.set((c-2)*pitch,pegTop-1.5-r*rp-.5,1+5);f.add(hook);
      const tag=new THREE.Mesh(new THREE.PlaneGeometry(5.8,1.6),M('#FFF3B0'));tag.position.set((c-2)*pitch,pegTop-1.5-r*rp-18.3,1.2);f.add(tag);}}
  if(CFG.promo){const p=new THREE.Mesh(new THREE.PlaneGeometry(w-5,CFG.promo),new THREE.MeshStandardMaterial({map:promoTex,roughness:.6}));p.position.set(0,trayTop+CFG.promo/2,1.05);f.add(p);
    [[8,BLUE],[17.5,ORANGE]].forEach(([x,c])=>{const dep=box(8.6,11,.15,M('#fff'),x,trayTop+8,2.2);f.add(dep);const bar=box(8.6,2,.18,M(c),x,trayTop+12.5,2.25);f.add(bar);
      const pocket=new THREE.Mesh(new THREE.BoxGeometry(9.6,8,2.6),new THREE.MeshPhysicalMaterial({color:'#dbe6f7',transparent:true,opacity:.45,roughness:.1,transmission:0}));pocket.position.set(x,trayTop+5,2.4);f.add(pocket)})}
  // vaschette + rulli
  CFG.trays.forEach(([L,ac],i)=>{const y=base+3+i*CFG.pitch;const tg=new THREE.Group();tg.position.set(0,y+4.2,1+9);tg.rotation.x=THREE.MathUtils.degToRad(15);f.add(tg);
    tg.add(box(w-5,.6,18,M('#efe6d2'),0,0,0));
    [-1,1].forEach(s=>tg.add(box(.5,5,18,M('#d9cdb0'),s*(w-5)/2,2.2,0)));
    const gap=1; const x0=-(ac*L+(ac-1)*gap)/2+L/2;
    for(let row=0;row<2;row++)for(let k=0;k<ac;k++){
      const fur=new THREE.Mesh(new THREE.CylinderGeometry(3.25,3.25,L,40),new THREE.MeshStandardMaterial({map:furTex((i+k)%2?'#f3f1e9':'#e9efe6'),roughness:.95}));
      fur.rotation.z=Math.PI/2;fur.position.set(x0+k*(L+gap),3.6,-4.5+row*7.3);fur.castShadow=true;fur.receiveShadow=true;tg.add(fur);
      const bandCol=(i+k)%2?BLUE:ORANGE;const band=new THREE.Mesh(new THREE.CylinderGeometry(3.3,3.3,2.2,40),M(bandCol,{roughness:.5}));band.rotation.z=Math.PI/2;band.position.copy(fur.position);tg.add(band);}
    const lip=new THREE.Mesh(new THREE.BoxGeometry(w-5,3.5,.6),new THREE.MeshStandardMaterial({map:lipTex,roughness:.5}));lip.position.set(0,1.6,9.2);lip.castShadow=true;tg.add(lip);
    const sw=box(2.6,2.6,.12,new THREE.MeshStandardMaterial({color:'#fff'}),-(w-5)/2+3,1.9,9.6);tg.add(sw);
  });
  return f;}
const f1=face();f1.position.z=d/2-1.0; g0.add(f1);
