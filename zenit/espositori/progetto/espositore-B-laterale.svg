<text x="840.0" y="252.4" font-size="21" text-anchor="start" fill="#3850A2" font-weight="bold" >Testata intercambiabile</text>
<text x="840.0" y="280.1" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >spessore 70, inserto stampato</text>
<text x="840.0" y="303.5" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >sfilabile; profili neri da 12</text>
<polyline points="814.0,380.0 830.0,380.0 838.0,367.8" fill="none" stroke="#6F7A8A" stroke-width="1"/>
<text x="840.0" y="374.1" font-size="21" text-anchor="start" fill="#3850A2" font-weight="bold" >Fascia a mensola</text>
<text x="840.0" y="401.8" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >aggetto 60, h 60</text>
<polyline points="814.0,600.0 830.0,600.0 838.0,564.4" fill="none" stroke="#6F7A8A" stroke-width="1"/>
<text x="840.0" y="570.7" font-size="21" text-anchor="start" fill="#3850A2" font-weight="bold" >Ganci e pennelli nudi</text>
<text x="840.0" y="598.4" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >asta Ø5 x L 150; fino a 3 pennelli per</text>
<text x="840.0" y="621.8" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >gancio, due file di ganci; pannello</text>
<text x="840.0" y="645.2" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >forato Ø5 passo 25</text>
<polyline points="814.0,1045.0 830.0,1045.0 838.0,1009.4" fill="none" stroke="#6F7A8A" stroke-width="1"/>
<text x="840.0" y="1015.7" font-size="21" text-anchor="start" fill="#3850A2" font-weight="bold" >Vasca a gradini</text>
<text x="840.0" y="1043.4" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >5 file in profondita', alzata 32 per</text>
<text x="840.0" y="1066.8" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >vedere il pelo, rulli in piedi Ø65 x</text>
<text x="840.0" y="1090.2" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >max 250, sponda h 70</text>
<polyline points="814.0,1270.0 830.0,1270.0 838.0,1257.8" fill="none" stroke="#6F7A8A" stroke-width="1"/>
<text x="840.0" y="1264.1" font-size="21" text-anchor="start" fill="#3850A2" font-weight="bold" >Zoccolo</text>
<text x="840.0" y="1291.8" font-size="18" text-anchor="start" fill="#1D2126" font-weight="normal" >appoggio su banco/piedini</text>
<text x="30.0" y="90.0" font-size="34" text-anchor="start" fill="#3850A2" font-weight="bold" >ESPOSITORE ZENIT  |  Da banco 50 cm (ridotto)</text>
<text x="30.0" y="128.0" font-size="20" text-anchor="start" fill="#6F7A8A" font-weight="normal" >VISTA LATERALE (sezione)  |  quote in mm  |  schema per preventivo: tutte le misure sono ipotesi da confermare</text>
<text x="30.0" y="1480.0" font-size="20" text-anchor="start" fill="#1D2126" font-weight="bold" >Capacita' indicativa: 10 posti gancio (fino a 30 pennelli nudi) + 30 rulli in piedi</text>
<text x="30.0" y="1508.0" font-size="17" text-anchor="start" fill="#6F7A8A" font-weight="normal" >Struttura metallo nero + pannelli stampati. Lunghezza pennelli 15-30 cm,</text>
<text x="30.0" y="1530.0" font-size="17" text-anchor="start" fill="#6F7A8A" font-weight="normal" >rulli max 25 cm / Ø 6,5 cm: ipotesi. QR = segnaposto non scansionabile.</text>
