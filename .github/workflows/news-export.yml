name: Genera abtg_news.csv (calendario EA)

# Genera SOLO il file news per gli EA (Forex Factory -> abtg_news.csv) e lo
# committa. Utile per rigenerarlo su richiesta senza inviare il report.
on:
  workflow_dispatch:
  # CLASSE 460 (19/09/2026) -- PRIMA NON C'ERA NESSUNO SCHEDULE, e questo
  # workflow aveva girato UNA volta sola in vita sua: il 23/07/2026. Il file
  # data/abtg_news.csv e' rimasto a 0 byte dal 26/07 al 19/09. L'attivita'
  # ABTG_AggiornaNews sul VPS lo scarica ogni mattina alle 07:20 ora italiana
  # (= 05:20 UTC in questo periodo), quindi qui si rigenera 40 minuti prima.
  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests
      - name: Genera abtg_news.csv
        # Esce 1 se il calendario non ha NESSUN evento futuro: un filtro news
        # senza eventi futuri e' un filtro spento, e prima falliva in silenzio
        # (feed rifiutato -> lista vuota -> file vuoto -> niente da committare
        # -> nessuno se ne accorgeva). Fallendo qui, il file BUONO gia' in repo
        # non viene sovrascritto e il workflow si vede rosso.
        run: python -m agent.news_export data/abtg_news.csv
      - name: Committa il file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/abtg_news.csv || true
          if git diff --staged --quiet; then
            echo "Nessuna modifica al file news."
          else
            git commit -m "news EA: aggiorna abtg_news.csv [skip ci]"
            git push
          fi
