name: Report di Mercato Giornaliero

on:
  # La sveglia ora e' il VPS: Task Scheduler -> workflow_dispatch alle 07:00
  # (puntuale, niente ritardo). Il cron 'schedule' di GitHub e' stato RIMOSSO
  # perche' partiva in ritardo (anche +2h) e avrebbe inviato una SECONDA email.
  # Per riattivare un fallback, rimettere qui: schedule: - cron: "0 5 * * 1-5"
  workflow_dispatch:        # lanciato dal VPS (e a mano). Forza sempre l'invio.

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write        # per committare lo snapshot giornaliero nel repo

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera e invia il report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Su esecuzione manuale forziamo l'invio ignorando il gate orario.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python run_report.py

      - name: Salva lo snapshot del giorno nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ || true
          if git diff --staged --quiet; then
            echo "Nessuno snapshot nuovo da committare."
          else
            git commit -m "snapshot: dati di mercato del giorno [skip ci]"
            git push
          fi
